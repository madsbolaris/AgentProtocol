name: E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      - '.claude/skills/expert-feedback/ui/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - '.claude/skills/expert-feedback/ui/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: .claude/skills/expert-feedback/ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .claude/skills/expert-feedback/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .claude/skills/expert-feedback/ui/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: .claude/skills/expert-feedback/ui/test-results/
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read test results
            let comment = '## 🎭 E2E Test Results\n\n';

            if (process.env.GITHUB_JOB_STATUS === 'success') {
              comment += '✅ All E2E tests passed!\n';
            } else {
              comment += '❌ Some E2E tests failed.\n\n';
              comment += 'Check the [test report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
