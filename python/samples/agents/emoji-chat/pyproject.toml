[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-chat-bot"
version = "0.1.0"
description = "Emoji Chat Bot sample demonstrating Microsoft Agents Protocol Hosting SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Microsoft Corporation"}
]

dependencies = [
    "microsoft-agents-protocol-hosting>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
emoji-chat-bot = "src.emoji_chat_bot:main"
