[pytest]
# Test discovery
testpaths = ../tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-config=.coveragerc
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=json
    --cov-fail-under=90
    # Uncomment for parallel execution:
    # -n auto

# Async support
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    slow: Slow running tests
    requires_recordings: Tests that need recorded API responses
    critical: Tests for critical functionality (core/, file_io/, state/)
    high: Tests for high priority modules
    medium: Tests for medium priority modules
    low: Tests for low priority modules

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning:common
    ignore::pytest.PytestUnraisableExceptionWarning

# Test coverage targets by module
# Note: Use markers to track priority:
#   - critical (core, file_io, state): 90-95%
#   - high (agents, prompts, logging): 80-90%
#   - medium (parsers, validation, artifacts): 85%
#   - low (ui, utils): 70%
