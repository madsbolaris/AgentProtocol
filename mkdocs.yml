site_name: Agent Framework Documentation
site_description: A unified protocol for building AI agents across multiple platforms and frameworks
site_author: Agent Framework Contributors

# Repository
repo_name: AgentFramework
repo_url: https://github.com/madsbolaris/AgentFramework
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 Agent Framework Contributors

# Configuration
docs_dir: docs
site_dir: site

# Theme Configuration
theme:
  name: material
  language: en
  custom_dir: docs/overrides  # Custom template overrides for search positioning

  # Color scheme - Professional Bloomberg-inspired
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode - Professional
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Features
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    # - navigation.indexes  # Temporarily disabled to test tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  # Icons
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

  # Font - Anaheim & JetBrains Mono from Bunny Fonts (loaded via extra.css)
  font:
    text: Anaheim
    code: JetBrains Mono

  # Favicon
  # favicon: assets/favicon.png

  # Logo
  # logo: assets/logo.png

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - awesome-pages
  - section-index
  # - test-examples:
  #     snippets_dir: docs/snippets
  #     results_dir: test-data/results
  #     enable_validation: true
  #     show_language_tabs: true
  # Temporarily disabled - enable after git repository is properly initialized
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: timeago
  #     fallback_to_build_date: true

# Extensions
markdown_extensions:
  # Custom extensions
  - hashicorp_cards

  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - markdown_extensions.hashicorp_tabs

