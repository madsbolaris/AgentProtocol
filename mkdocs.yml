# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/madsbolaris/AgentFramework
      name: GitHub Repository

  version:
    provider: mike
    default: latest

  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve by
            <a href="https://github.com/madsbolaris/AgentFramework/issues/new" target="_blank" rel="noopener">opening an issue</a>.

# Extra CSS - Complete HashiCorp CSS from working complete-page.html
extra_css:
  - assets/css/main.css              # Main HashiCorp CSS (262KB, 1426 rules)
  - assets/css/inline-styles-1.css   # Inline style block 1 (49KB)
  - assets/css/inline-styles-2.css   # Inline style block 2 (16KB)
  - assets/css/inline-styles-3.css   # Inline style block 3 (15KB)
  - assets/css/inline-styles-4.css   # Inline style block 4 (16KB)
  - assets/css/inline-styles-5.css   # Inline style block 5 (5.5KB)
  - assets/css/inline-styles-6.css   # Inline style block 6 (819B)
  - assets/css/icon-fixes.css        # Fix oversized twemoji icons

# Extra JavaScript
extra_javascript:
  - assets/js/tabbed-sync.js
  - assets/js/scroll-scrims.js  # HashiCorp scroll fade effects
  - assets/js/hashicorp-tabs.js  # HashiCorp tab switching
  - assets/js/nav-toggle.js  # Navigation expand/collapse
  - assets/js/copy-button.js  # Code block copy functionality

# Watch for changes
watch:
  - docs
  - docs/assets
  - docs/assets/css

# Validation
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
