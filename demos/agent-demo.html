<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Protocol Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .bot-selector {
            padding: 20px;
            background: #f7f7f7;
            border-bottom: 1px solid #e0e0e0;
        }

        .bot-selector label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .bot-selector select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .bot-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .mode-selector {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-toggle label {
            margin: 0;
            font-weight: 500;
            font-size: 13px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 28px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #667eea;
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .mode-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }

        .mode-label.active {
            color: #667eea;
        }

        .status {
            padding: 12px 20px;
            background: #f0f0f0;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status.connected .status-indicator {
            animation: pulse 2s ease-in-out infinite;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-items: flex-end;
        }

        .message-content {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 80%;
        }

        .message.user .message-content {
            flex-direction: row-reverse;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .emoji-reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .emoji-button {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 4px 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .emoji-button:hover {
            background: #f0f0f0;
            transform: scale(1.1);
        }

        .emoji-button.active {
            background: #667eea;
            border-color: #667eea;
            transform: scale(1.15);
        }

        .emoji-button .count {
            font-size: 11px;
            font-weight: 600;
            color: #666;
        }

        .emoji-button.active .count {
            color: white;
        }

        .add-reaction-btn {
            background: #f0f0f0;
            border: 1px dashed #ccc;
            border-radius: 12px;
            padding: 4px 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .add-reaction-btn:hover {
            background: #e0e0e0;
            opacity: 1;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .input-container button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-container button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .input-container button:active:not(:disabled) {
            transform: translateY(0);
        }

        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-section {
            padding: 15px 20px;
            background: #f0f0f0;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
            width: 100%;
            box-sizing: border-box;
        }

        .info-section strong {
            color: #333;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Agent Protocol Demo</h1>
            <p>Select a bot and start chatting!</p>
        </div>

        <div class="bot-selector">
            <label for="bot-select">Choose a bot:</label>
            <select id="bot-select" onchange="switchBot()">
                <option value="">Loading bots...</option>
            </select>

            <div class="mode-selector">
                <div class="mode-toggle">
                    <span class="mode-label" id="waitLabel">Wait</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="streamToggle" onchange="toggleStreamMode()">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="mode-label active" id="streamLabel">Stream</span>
                </div>
            </div>
        </div>

        <div class="status" id="status">
            <div class="status-indicator"></div>
            <span>Connecting...</span>
        </div>

        <div class="chat-container" id="chat">
        </div>

        <div class="input-container">
            <input
                type="text"
                id="input"
                placeholder="Type your message..."
                onkeypress="if(event.key === 'Enter' && !event.shiftKey) sendMessage()"
                disabled
            />
            <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
        </div>

        <div class="info-section" id="info">
            <strong>Thread ID:</strong> <span id="threadId">-</span><br>
            <strong>Current Bot:</strong> <span id="currentBot">-</span><br>
            <strong>Mode:</strong> <span id="currentMode">Stream</span><br>
            <strong>Reactions:</strong> <span id="reactionsSupport">-</span>
        </div>
    </div>

    <script>
        /**
         * Agent Protocol Demo UI
         *
         * This UI polls agent health endpoints to populate the dropdown with available agents.
         * Connection errors (ERR_CONNECTION_REFUSED) are expected when agents aren't running.
         *
         * To hide these errors in Chrome DevTools Console:
         * 1. Click the filter icon (funnel) in Console
         * 2. Add this filter: -ERR_CONNECTION_REFUSED
         *
         * Or hide all network errors: Settings (gear icon) → Check "Hide network"
         */

        let bots = {};
        let currentBot = null;
        let currentAgentCard = null;
        let threadId = 'thread-' + Date.now();
        let messages = [];
        let useStreaming = true; // Default to streaming mode

        // Update UI elements
        document.getElementById('threadId').textContent = threadId;

        // Initialize toggle state
        document.getElementById('streamToggle').checked = useStreaming;

        // Load bot configuration and check which bots are running
        async function loadBots(preserveSelection = false) {
            try {
                const response = await fetch('/agent-config.json');
                const config = await response.json();
                const allBots = config.bots || {};

                const select = document.getElementById('bot-select');
                const previousSelection = select.value;

                // Check health of each bot
                const botHealthChecks = await Promise.all(
                    Object.entries(allBots).map(async ([key, bot]) => {
                        const url = `${bot.baseUrl}:${bot.port}/health`;
                        try {
                            const healthResponse = await fetch(url, {
                                method: 'GET',
                                signal: AbortSignal.timeout(2000), // 2 second timeout
                                cache: 'no-store' // Don't cache health checks
                            });
                            return { key, bot, isRunning: healthResponse.ok };
                        } catch (error) {
                            // Expected failure when agent isn't running
                            // Note: Browser will log network errors - use DevTools filter to hide them:
                            // In Console, add filter: -ERR_CONNECTION_REFUSED
                            return { key, bot, isRunning: false };
                        }
                    })
                );

                // Filter to only running bots
                const runningBots = botHealthChecks.filter(b => b.isRunning);
                bots = {};
                runningBots.forEach(({ key, bot }) => {
                    bots[key] = bot;
                });

                // Update dropdown
                select.innerHTML = '<option value="">-- Select a bot --</option>';

                if (runningBots.length === 0) {
                    const option = document.createElement('option');
                    option.value = "";
                    option.textContent = "No bots are currently running";
                    option.disabled = true;
                    select.appendChild(option);
                    if (!currentBot) {
                        updateStatus('⚠️ No bots are currently running', 'disconnected');
                    }
                } else {
                    runningBots.forEach(({ key, bot }) => {
                        const option = document.createElement('option');
                        option.value = key;
                        option.textContent = bot.name;
                        select.appendChild(option);
                    });

                    // Restore previous selection if it's still available
                    if (preserveSelection && previousSelection && bots[previousSelection]) {
                        select.value = previousSelection;
                    }

                    if (!currentBot) {
                        updateStatus(`${runningBots.length} bot(s) available`, 'connected');
                    }
                }
            } catch (error) {
                console.error('Failed to load bot configuration:', error);
                if (!currentBot) {
                    updateStatus('⚠️ Failed to load bot configuration', 'disconnected');
                }
            }
        }

        // Fetch agent card to get capabilities
        async function fetchAgentCard() {
            if (!currentBot) return null;

            const url = `${currentBot.baseUrl}:${currentBot.port}/agent-card`;

            try {
                const response = await fetch(url);
                if (response.ok) {
                    const agentCard = await response.json();
                    console.log('Agent card:', agentCard);
                    return agentCard;
                } else {
                    console.warn('Agent card not available, using defaults');
                    return null;
                }
            } catch (error) {
                console.warn('Failed to fetch agent card:', error);
                return null;
            }
        }

        // Check if agent supports reaction content type
        function supportsReactions(agentCard) {
            if (!agentCard) return false;

            // Check if the agent declares support for reaction content type
            // Support both naming conventions: outputContentTypes, outputModes, output_modes
            const outputTypes = agentCard.outputContentTypes || agentCard.outputModes || agentCard.output_modes || [];
            return outputTypes.some(type =>
                type === 'reaction' ||
                type.kind === 'reaction' ||
                type === 'message-reaction'
            );
        }

        // Switch to a different bot
        async function switchBot() {
            const select = document.getElementById('bot-select');
            const botKey = select.value;

            if (!botKey) {
                currentBot = null;
                currentAgentCard = null;
                document.getElementById('input').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('currentBot').textContent = '-';
                document.getElementById('reactionsSupport').textContent = '-';
                updateStatus('No bot selected', '');
                return;
            }

            currentBot = {
                key: botKey,
                ...bots[botKey]
            };

            // Reset conversation
            messages = [];
            document.getElementById('chat').innerHTML = '';
            threadId = 'thread-' + Date.now();
            document.getElementById('threadId').textContent = threadId;
            document.getElementById('currentBot').textContent = currentBot.name;

            // Fetch agent card to determine capabilities
            currentAgentCard = await fetchAgentCard();

            // Update reactions support indicator
            const hasReactions = currentAgentCard && supportsReactions(currentAgentCard);
            document.getElementById('reactionsSupport').textContent = hasReactions ? '✅ Enabled' : '❌ Not Supported';

            // Check bot health
            await checkHealth();

            // Add welcome message
            const welcomeMsg = `🤖 Connected to ${currentBot.name}. Start chatting!`;
            if (hasReactions) {
                addMessage(welcomeMsg + '\n✨ This agent supports emoji reactions!', false);
            } else {
                addMessage(welcomeMsg, false);
            }
        }

        // Check if bot is accessible
        async function checkHealth() {
            if (!currentBot) return;

            const url = `${currentBot.baseUrl}:${currentBot.port}/health`;

            try {
                const response = await fetch(url, { cache: 'no-store' });
                if (response.ok) {
                    updateStatus(`✅ Connected to ${currentBot.name}`, 'connected');
                    document.getElementById('input').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('input').focus();
                } else {
                    throw new Error('Health check failed');
                }
            } catch (error) {
                // Expected when agent is not running
                // Note: Browser will log network errors - use DevTools filter to hide them
                updateStatus(`⚠️ Cannot connect to ${currentBot.name}. Make sure it's running on port ${currentBot.port}.`, 'disconnected');
                document.getElementById('input').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            }
        }

        // Update status indicator
        function updateStatus(message, className = '') {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<div class="status-indicator"></div><span>${message}</span>`;
            statusEl.className = 'status ' + className;
        }

        // Toggle between wait and stream modes
        function toggleStreamMode() {
            const toggle = document.getElementById('streamToggle');
            useStreaming = toggle.checked;

            // Update labels
            const waitLabel = document.getElementById('waitLabel');
            const streamLabel = document.getElementById('streamLabel');

            if (useStreaming) {
                waitLabel.classList.remove('active');
                streamLabel.classList.add('active');
                document.getElementById('currentMode').textContent = 'Stream';
            } else {
                streamLabel.classList.remove('active');
                waitLabel.classList.add('active');
                document.getElementById('currentMode').textContent = 'Wait';
            }
        }

        // Available emoji reactions
        const availableEmojis = ['👍', '❤️', '😂', '😮', '😢', '🎉'];

        // Store reactions per message (message index -> emoji -> count)
        const messageReactions = {};

        // Add message to chat
        function addMessage(text, isUser = false) {
            const chat = document.getElementById('chat');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            // Create message content container
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // Create message bubble
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            contentDiv.appendChild(bubble);
            messageDiv.appendChild(contentDiv);

            // Add emoji reactions container only if agent supports reactions
            const messageIndex = chat.children.length;
            messageReactions[messageIndex] = {};

            if (currentAgentCard && supportsReactions(currentAgentCard)) {
                const reactionsContainer = document.createElement('div');
                reactionsContainer.className = 'emoji-reactions';
                reactionsContainer.id = `reactions-${messageIndex}`;

                // Add common emoji buttons
                availableEmojis.forEach(emoji => {
                    const emojiBtn = createEmojiButton(emoji, messageIndex);
                    reactionsContainer.appendChild(emojiBtn);
                });

                messageDiv.appendChild(reactionsContainer);
            }

            chat.appendChild(messageDiv);

            // Scroll to bottom
            chat.scrollTop = chat.scrollHeight;
        }

        // Create an emoji reaction button
        function createEmojiButton(emoji, messageIndex) {
            const button = document.createElement('button');
            button.className = 'emoji-button';
            button.innerHTML = `<span>${emoji}</span>`;
            button.dataset.emoji = emoji;
            button.dataset.messageIndex = messageIndex;

            button.onclick = () => toggleReaction(emoji, messageIndex);

            return button;
        }

        // Toggle emoji reaction
        function toggleReaction(emoji, messageIndex) {
            const reactions = messageReactions[messageIndex];

            if (!reactions[emoji]) {
                // Add reaction
                reactions[emoji] = { count: 1, active: true };
            } else if (reactions[emoji].active) {
                // Remove reaction
                reactions[emoji].count--;
                reactions[emoji].active = false;
                if (reactions[emoji].count === 0) {
                    delete reactions[emoji];
                }
            } else {
                // Re-add reaction
                reactions[emoji].count++;
                reactions[emoji].active = true;
            }

            updateReactionDisplay(messageIndex);
        }

        // Update the visual display of reactions
        function updateReactionDisplay(messageIndex) {
            const container = document.getElementById(`reactions-${messageIndex}`);
            if (!container) return;

            // Clear existing buttons
            container.innerHTML = '';

            const reactions = messageReactions[messageIndex];

            // Re-create buttons with updated counts
            availableEmojis.forEach(emoji => {
                const button = document.createElement('button');
                button.className = 'emoji-button';
                button.dataset.emoji = emoji;
                button.dataset.messageIndex = messageIndex;

                if (reactions[emoji] && reactions[emoji].count > 0) {
                    // Show with count
                    if (reactions[emoji].active) {
                        button.classList.add('active');
                    }
                    button.innerHTML = `
                        <span>${emoji}</span>
                        <span class="count">${reactions[emoji].count}</span>
                    `;
                } else {
                    // Show without count
                    button.innerHTML = `<span>${emoji}</span>`;
                }

                button.onclick = () => toggleReaction(emoji, messageIndex);
                container.appendChild(button);
            });
        }

        // Send message to bot
        async function sendMessage() {
            if (!currentBot) return;

            const input = document.getElementById('input');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message) return;

            // Add user message to UI
            addMessage(message, true);
            input.value = '';
            sendBtn.disabled = true;
            input.disabled = true;

            try {
                if (useStreaming) {
                    await sendMessageStream(message);
                } else {
                    await sendMessageWait(message);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('❌ Sorry, I encountered an error. Please try again.');
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        // Send message using /wait endpoint
        async function sendMessageWait(message) {
            const url = `${currentBot.baseUrl}:${currentBot.port}/runs/wait`;
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    agentId: currentBot.key,
                    threadId: threadId,
                    input: [{
                        role: 'user',
                        contents: [{
                            kind: 'text',
                            text: message
                        }]
                    }]
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const run = await response.json();

            // Extract bot text from Agent Protocol output
            const output = run.output || [];
            const botText = output.map(msg =>
                msg.contents.map(c => c.text).filter(t => t).join('')
            ).filter(t => t).join('\n') || '(No response)';

            // Add bot response to UI
            addMessage(botText);

            // Store in messages array for context
            messages.push({
                role: 'user',
                text: message
            });
            messages.push({
                role: 'bot',
                text: botText
            });
        }

        // Send message using /stream endpoint
        async function sendMessageStream(message) {
            const url = `${currentBot.baseUrl}:${currentBot.port}/runs/stream`;
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    agentId: currentBot.key,
                    threadId: threadId,
                    input: [{
                        role: 'user',
                        contents: [{
                            kind: 'text',
                            text: message
                        }]
                    }]
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            // Read the streaming response
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let botText = '';
            let currentMessageDiv = null;
            let currentBubble = null;

            // Create message element for streaming
            const chat = document.getElementById('chat');
            currentMessageDiv = document.createElement('div');
            currentMessageDiv.className = 'message bot';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            currentBubble = document.createElement('div');
            currentBubble.className = 'message-bubble';
            currentBubble.textContent = '';

            contentDiv.appendChild(currentBubble);
            currentMessageDiv.appendChild(contentDiv);
            chat.appendChild(currentMessageDiv);

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line in buffer

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const event = JSON.parse(data);
                                console.log('[SSE Event]', event.event, 'Full event:', event);

                                // Handle different event types
                                if (event.event === 'message.delta' || event.event === 'run.delta') {
                                    console.log('[message.delta] Processing delta event');
                                    // Extract text from delta
                                    const delta = event.data?.delta;
                                    console.log('[message.delta] Delta object:', delta);
                                    if (delta?.contents) {
                                        console.log('[message.delta] Contents array:', delta.contents);
                                        for (const content of delta.contents) {
                                            console.log('[message.delta] Content item:', content);
                                            if (content.kind === 'text' && content.text) {
                                                console.log('[message.delta] Adding text:', content.text);
                                                botText += content.text;
                                                currentBubble.textContent = botText;
                                                chat.scrollTop = chat.scrollHeight;
                                            } else {
                                                console.warn('[message.delta] Skipped content - kind:', content.kind, 'text:', content.text);
                                            }
                                        }
                                    } else {
                                        console.warn('[message.delta] No delta.contents found');
                                    }
                                } else if (event.event === 'run.completed') {
                                    console.log('[run.completed] Processing completion event');
                                    // Final message - extract complete output
                                    const output = event.data?.output || [];
                                    const finalText = output.map(msg =>
                                        msg.contents.map(c => c.text).filter(t => t).join('')
                                    ).filter(t => t).join('\n');

                                    if (finalText && finalText !== botText) {
                                        botText = finalText;
                                        currentBubble.textContent = botText;
                                    }
                                } else {
                                    console.log('[SSE Event] Unhandled event type:', event.event);
                                }
                            } catch (e) {
                                console.error('Error parsing SSE data:', e, 'Data was:', data);
                            }
                        }
                    }
                }
            } finally {
                reader.releaseLock();
            }

            // If no text was received, show a default message
            if (!botText) {
                console.error('[STREAMING ERROR] No text received from bot. Check the console logs above for details.');
                botText = '(No response)';
                currentBubble.textContent = botText;
            } else {
                console.log('[STREAMING SUCCESS] Final botText:', botText);
            }

            // Add reactions container if supported
            const messageIndex = chat.children.length - 1;
            messageReactions[messageIndex] = {};

            if (currentAgentCard && supportsReactions(currentAgentCard)) {
                const reactionsContainer = document.createElement('div');
                reactionsContainer.className = 'emoji-reactions';
                reactionsContainer.id = `reactions-${messageIndex}`;

                availableEmojis.forEach(emoji => {
                    const emojiBtn = createEmojiButton(emoji, messageIndex);
                    reactionsContainer.appendChild(emojiBtn);
                });

                currentMessageDiv.appendChild(reactionsContainer);
            }

            // Store in messages array for context
            messages.push({
                role: 'user',
                text: message
            });
            messages.push({
                role: 'bot',
                text: botText
            });
        }

        // Initialize
        loadBots();
        addMessage('👋 Select a bot above to start chatting!', false);
        toggleStreamMode(); // Initialize mode labels

        // Check health of current bot periodically
        setInterval(() => {
            if (currentBot) {
                checkHealth();
            }
        }, 10000); // Every 10 seconds

        // Auto-detect new/stopped bots periodically
        setInterval(() => {
            loadBots(true); // preserve current selection
        }, 5000); // Every 5 seconds
    </script>
</body>
</html>
