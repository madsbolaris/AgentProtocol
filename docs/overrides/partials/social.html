{#-
  Custom social links partial
-#}

{% if config.extra.social %}
  <div class="md-social">
    {% for social in config.extra.social %}
      <a href="{{ social.link }}"
         target="_blank"
         rel="noopener"
         title="{{ social.name }}"
         class="md-social__link">
        {% include ".icons/" ~ social.icon ~ ".svg" %}
      </a>
    {% endfor %}
  </div>
{% endif %}
