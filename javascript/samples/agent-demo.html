<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Protocol Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .bot-selector {
            padding: 20px;
            background: #f7f7f7;
            border-bottom: 1px solid #e0e0e0;
        }

        .bot-selector label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .bot-selector select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .bot-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .status {
            padding: 12px 20px;
            background: #f0f0f0;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status.connected .status-indicator {
            animation: pulse 2s ease-in-out infinite;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-items: flex-end;
        }

        .message-content {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 80%;
        }

        .message.user .message-content {
            flex-direction: row-reverse;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .emoji-reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .emoji-button {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 4px 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .emoji-button:hover {
            background: #f0f0f0;
            transform: scale(1.1);
        }

        .emoji-button.active {
            background: #667eea;
            border-color: #667eea;
            transform: scale(1.15);
        }

        .emoji-button .count {
            font-size: 11px;
            font-weight: 600;
            color: #666;
        }

        .emoji-button.active .count {
            color: white;
        }

        .add-reaction-btn {
            background: #f0f0f0;
            border: 1px dashed #ccc;
            border-radius: 12px;
            padding: 4px 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .add-reaction-btn:hover {
            background: #e0e0e0;
            opacity: 1;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-container input:focus {
            border-color: #667eea;
        }

        .input-container input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .input-container button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-container button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .input-container button:active:not(:disabled) {
            transform: translateY(0);
        }

        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-section {
            padding: 15px 20px;
            background: #f0f0f0;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }

        .info-section strong {
            color: #333;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Agent Protocol Demo</h1>
            <p>Select a bot and start chatting!</p>
        </div>

        <div class="bot-selector">
            <label for="bot-select">Choose a bot:</label>
            <select id="bot-select" onchange="switchBot()">
                <option value="">Loading bots...</option>
            </select>
        </div>

        <div class="status" id="status">
            <div class="status-indicator"></div>
            <span>Connecting...</span>
        </div>

        <div class="chat-container" id="chat">
        </div>

        <div class="input-container">
            <input
                type="text"
                id="input"
                placeholder="Type your message..."
                onkeypress="if(event.key === 'Enter' && !event.shiftKey) sendMessage()"
                disabled
            />
            <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
        </div>

        <div class="info-section" id="info">
            <strong>Thread ID:</strong> <span id="threadId">-</span><br>
            <strong>Current Bot:</strong> <span id="currentBot">-</span><br>
            <strong>Reactions:</strong> <span id="reactionsSupport">-</span>
        </div>
    </div>

    <script>
        let bots = {};
        let currentBot = null;
        let currentAgentCard = null;
        let threadId = 'thread-' + Date.now();
        let messages = [];

        // Update UI elements
        document.getElementById('threadId').textContent = threadId;

        // Load bot configuration
        async function loadBots() {
            try {
                const response = await fetch('/agent-config.json');
                const config = await response.json();
                bots = config.bots || {};

                const select = document.getElementById('bot-select');
                select.innerHTML = '<option value="">-- Select a bot --</option>';

                Object.entries(bots).forEach(([key, bot]) => {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = bot.name;
                    select.appendChild(option);
                });

                console.log('Loaded bots:', Object.keys(bots));
            } catch (error) {
                console.error('Failed to load bot configuration:', error);
                updateStatus('⚠️ Failed to load bot configuration', 'disconnected');
            }
        }

        // Fetch agent card to get capabilities
        async function fetchAgentCard() {
            if (!currentBot) return null;

            const url = `${currentBot.baseUrl}:${currentBot.port}/agent-card`;

            try {
                const response = await fetch(url);
                if (response.ok) {
                    const agentCard = await response.json();
                    console.log('Agent card:', agentCard);
                    return agentCard;
                } else {
                    console.warn('Agent card not available, using defaults');
                    return null;
                }
            } catch (error) {
                console.warn('Failed to fetch agent card:', error);
                return null;
            }
        }

        // Check if agent supports reaction content type
        function supportsReactions(agentCard) {
            if (!agentCard) return false;

            // Check if the agent declares support for reaction content type
            const outputContentTypes = agentCard.outputContentTypes || [];
            return outputContentTypes.some(type =>
                type === 'reaction' ||
                type.kind === 'reaction' ||
                type === 'message-reaction'
            );
        }

        // Switch to a different bot
        async function switchBot() {
            const select = document.getElementById('bot-select');
            const botKey = select.value;

            if (!botKey) {
                currentBot = null;
                currentAgentCard = null;
                document.getElementById('input').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('currentBot').textContent = '-';
                document.getElementById('reactionsSupport').textContent = '-';
                updateStatus('No bot selected', '');
                return;
            }

            currentBot = {
                key: botKey,
                ...bots[botKey]
            };

            // Reset conversation
            messages = [];
            document.getElementById('chat').innerHTML = '';
            threadId = 'thread-' + Date.now();
            document.getElementById('threadId').textContent = threadId;
            document.getElementById('currentBot').textContent = currentBot.name;

            // Fetch agent card to determine capabilities
            currentAgentCard = await fetchAgentCard();

            // Update reactions support indicator
            const hasReactions = currentAgentCard && supportsReactions(currentAgentCard);
            document.getElementById('reactionsSupport').textContent = hasReactions ? '✅ Enabled' : '❌ Not Supported';

            // Check bot health
            await checkHealth();

            // Add welcome message
            const welcomeMsg = `🤖 Connected to ${currentBot.name}. Start chatting!`;
            if (hasReactions) {
                addMessage(welcomeMsg + '\n✨ This agent supports emoji reactions!', false);
            } else {
                addMessage(welcomeMsg, false);
            }
        }

        // Check if bot is accessible
        async function checkHealth() {
            if (!currentBot) return;

            const url = `${currentBot.baseUrl}:${currentBot.port}/health`;

            try {
                const response = await fetch(url);
                if (response.ok) {
                    updateStatus(`✅ Connected to ${currentBot.name}`, 'connected');
                    document.getElementById('input').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('input').focus();
                } else {
                    throw new Error('Health check failed');
                }
            } catch (error) {
                console.error('Health check failed:', error);
                updateStatus(`⚠️ Cannot connect to ${currentBot.name}. Make sure it's running on port ${currentBot.port}.`, 'disconnected');
                document.getElementById('input').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            }
        }

        // Update status indicator
        function updateStatus(message, className = '') {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<div class="status-indicator"></div><span>${message}</span>`;
            statusEl.className = 'status ' + className;
        }

        // Available emoji reactions
        const availableEmojis = ['👍', '❤️', '😂', '😮', '😢', '🎉'];

        // Store reactions per message (message index -> emoji -> count)
        const messageReactions = {};

        // Add message to chat
        function addMessage(text, isUser = false) {
            const chat = document.getElementById('chat');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            // Create message content container
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // Create message bubble
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            contentDiv.appendChild(bubble);
            messageDiv.appendChild(contentDiv);

            // Add emoji reactions container only if agent supports reactions
            const messageIndex = chat.children.length;
            messageReactions[messageIndex] = {};

            if (currentAgentCard && supportsReactions(currentAgentCard)) {
                const reactionsContainer = document.createElement('div');
                reactionsContainer.className = 'emoji-reactions';
                reactionsContainer.id = `reactions-${messageIndex}`;

                // Add common emoji buttons
                availableEmojis.forEach(emoji => {
                    const emojiBtn = createEmojiButton(emoji, messageIndex);
                    reactionsContainer.appendChild(emojiBtn);
                });

                messageDiv.appendChild(reactionsContainer);
            }

            chat.appendChild(messageDiv);

            // Scroll to bottom
            chat.scrollTop = chat.scrollHeight;
        }

        // Create an emoji reaction button
        function createEmojiButton(emoji, messageIndex) {
            const button = document.createElement('button');
            button.className = 'emoji-button';
            button.innerHTML = `<span>${emoji}</span>`;
            button.dataset.emoji = emoji;
            button.dataset.messageIndex = messageIndex;

            button.onclick = () => toggleReaction(emoji, messageIndex);

            return button;
        }

        // Toggle emoji reaction
        function toggleReaction(emoji, messageIndex) {
            const reactions = messageReactions[messageIndex];

            if (!reactions[emoji]) {
                // Add reaction
                reactions[emoji] = { count: 1, active: true };
            } else if (reactions[emoji].active) {
                // Remove reaction
                reactions[emoji].count--;
                reactions[emoji].active = false;
                if (reactions[emoji].count === 0) {
                    delete reactions[emoji];
                }
            } else {
                // Re-add reaction
                reactions[emoji].count++;
                reactions[emoji].active = true;
            }

            updateReactionDisplay(messageIndex);
        }

        // Update the visual display of reactions
        function updateReactionDisplay(messageIndex) {
            const container = document.getElementById(`reactions-${messageIndex}`);
            if (!container) return;

            // Clear existing buttons
            container.innerHTML = '';

            const reactions = messageReactions[messageIndex];

            // Re-create buttons with updated counts
            availableEmojis.forEach(emoji => {
                const button = document.createElement('button');
                button.className = 'emoji-button';
                button.dataset.emoji = emoji;
                button.dataset.messageIndex = messageIndex;

                if (reactions[emoji] && reactions[emoji].count > 0) {
                    // Show with count
                    if (reactions[emoji].active) {
                        button.classList.add('active');
                    }
                    button.innerHTML = `
                        <span>${emoji}</span>
                        <span class="count">${reactions[emoji].count}</span>
                    `;
                } else {
                    // Show without count
                    button.innerHTML = `<span>${emoji}</span>`;
                }

                button.onclick = () => toggleReaction(emoji, messageIndex);
                container.appendChild(button);
            });
        }

        // Send message to bot
        async function sendMessage() {
            if (!currentBot) return;

            const input = document.getElementById('input');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message) return;

            // Add user message to UI
            addMessage(message, true);
            input.value = '';
            sendBtn.disabled = true;
            input.disabled = true;

            // Add to messages array
            messages.push({
                role: 'user',
                contents: [{ kind: 'text', text: message }]
            });

            try {
                // Send to bot
                const url = `${currentBot.baseUrl}:${currentBot.port}/api/messages`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        threadId,
                        runId: 'run-' + Date.now(),
                        messages
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const botMessage = await response.json();
                const botText = botMessage.contents
                    .filter(c => c.kind === 'text')
                    .map(c => c.text)
                    .join(' ');

                // Add bot response to UI
                addMessage(botText);

                // Add to messages array
                messages.push(botMessage);

            } catch (error) {
                console.error('Error:', error);
                addMessage('❌ Sorry, I encountered an error. Please try again.');
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        // Initialize
        loadBots();
        addMessage('👋 Select a bot above to start chatting!', false);

        // Check health periodically
        setInterval(() => {
            if (currentBot) {
                checkHealth();
            }
        }, 10000); // Every 10 seconds
    </script>
</body>
</html>
