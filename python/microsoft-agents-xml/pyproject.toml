[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-agents-xml"
version = "0.1.0"
description = "XML serialization for Agent Framework messages - Python implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Agent Protocol Contributors"}
]
keywords = ["agent", "xml", "serialization", "messages", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "xsdata>=24.0",  # XML dataclass serialization
    "lxml>=5.0",     # XML parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.1.0",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/madsbolaris/AgentFramework"
Repository = "https://github.com/madsbolaris/AgentFramework"
Documentation = "https://agentframework.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]
include = ["microsoft*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
